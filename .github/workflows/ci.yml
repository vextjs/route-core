name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build-test-benchmark:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20.x
          - 22.x

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Benchmark smoke
        run: npm run bench
        env:
          ROUTE_CORE_BENCH_ITERATIONS: 10000
          ROUTE_CORE_BENCH_ASSERT: 1

      - name: Runtime dependency check
        run: npm ls --omit=dev

      - name: Security audit
        run: npm audit --omit=dev

      - name: Package dry run
        run: npm pack --dry-run
